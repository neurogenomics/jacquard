# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "scrna_arm"
description: Trim, QC and quantify the scRNA arm of a prepared sample with fastp, FastQC and STARsolo, optionally keeping a tagged BAM
keywords:
  - single-cell
  - rnaseq
  - starsolo
  - quantification
components:
  - fastp
  - resyncbarcodes
  - fastqc
  - star/genomegenerate
  - star/starsolo
  - samtools/index
input:
  - ch_arm:
      type: file
      description: |
        One gated scRNA arm per sample, as `ARM_FANOUT` emits it: the cDNA insert R1 was trimmed
        to, the untouched R2 mate, and the synthesized barcode-plus-UMI read. `meta.id` is already
        `<sample>.none`, which is what names every output path and MultiQC row for this arm.
        Structure: [ val(meta), path(r1), path(r2), path(barcodes) ]
  - fasta:
      type: string
      description: Genome FASTA an index is built from when `star_index` is not given
  - gtf:
      type: string
      description: Gene annotation GTF an index is built from when `star_index` is not given; STARsolo counts against the annotation baked into the index, so it is never passed again at mapping time
  - star_index:
      type: string
      description: Prebuilt STAR index directory, or null to build one from `fasta` and `gtf`
  - skip_trimming:
      type: boolean
      description: Run the arm on the reads prepare-reads wrote, bypassing fastp and the barcode resync
  - min_arm_reads:
      type: integer
      description: Read pairs an arm must still carry after trimming to proceed; one below it is dropped and the run continues
output:
  - counts:
      type: directory
      description: |
        STARsolo's own output tree for the arm, carrying the raw and filtered cell-by-gene matrices.
        Structure: [ val(meta), path("*.Solo.out") ]
  - summary:
      type: file
      description: |
        STARsolo's per-arm run summary, the numbers a cell-calling decision is read off.
        Structure: [ val(meta), path("*/Gene/Summary.csv") ]
  - log_final:
      type: file
      description: |
        STAR's alignment summary for the arm, which is what MultiQC's STAR section is built from.
        Structure: [ val(meta), path("*Log.final.out") ]
  - bam:
      type: file
      description: |
        STARsolo's coordinate-sorted alignments and their index, tagged with the corrected cell
        barcode and UMI (`CB`/`UB`). Written only under `--solo_bam`; empty otherwise.
        Structure: [ val(meta), path("*.bam"), path("*.bai") ]
  - reads:
      type: file
      description: |
        The arm as STARsolo saw it: the trimmed cDNA pair and the barcode read resynced to it, or
        the untouched trio under `skip_trimming`.
        Structure: [ val(meta), path(r1), path(r2), path(barcodes) ]
  - index:
      type: directory
      description: |
        The STAR index the arm was mapped against, built here unless one was given. Only ever
        emitted once a gated arm exists, so a run with no scRNA arm left builds nothing.
        Structure: [ val(meta), path("star") ]
  - trim_json:
      type: file
      description: |
        fastp's own report for the arm, empty under `skip_trimming`. It carries the post-trim read
        count the gate reads, and is the only place a dropped arm's reason is legible.
        Structure: [ val(meta), path("*.fastp.json") ]
  - gate:
      type: file
      description: |
        The post-trim verdict per arm, empty under `skip_trimming`. The caller records it in
        `arm_gate.tsv`, replacing the arm's pre-trim row.
        Structure: [ val(meta), val(reads), val(status) ]
  - multiqc_files:
      type: file
      description: |
        The arm's fastp report, FastQC archive and STAR log, ready to mix into the report.
        Structure: path(mqc_file)
  - versions:
      type: file
      description: |
        Version files, empty because every module here reports on the `versions` topic instead.
        Structure: [ path(versions.yml) ]
authors:
  - "@HDash"
  - "@chris-cheshire"
maintainers:
  - "@HDash"
  - "@chris-cheshire"
