report_comment: >
  This report has been generated by the <a href="https://github.com/neurogenomics/jacquard/tree/dev" target="_blank">neurogenomics/jacquard</a>
  analysis pipeline.
# Left alone, MultiQC orders carmack's custom-content sections roughly by payload id, which
# interleaves the stages: linear dedup lands fourth and fifth of twelve, in among read preparation,
# and prepare-reads' distribution sixth. These put them in the order the reads pass through them,
# and each stage's sections in the order its report reads.
report_section_order:
  carmack_extraction_breakdown:
    order: 1001
  carmack_extraction_barcode_rank:
    order: 1002
  carmack_extraction_edit_distance:
    order: 1003
  carmack_umi_breakdown:
    order: 1004
  carmack_umi_anchor_run:
    order: 1005
  carmack_tgidx_breakdown:
    order: 1006
  carmack_tgidx_target_distribution:
    order: 1007
  carmack_tgidx_edit_distance:
    order: 1008
  carmack_tgidx_anchor_run:
    order: 1009
  carmack_prepare_target_distribution:
    order: 1010
  # Linear dedup runs after alignment and after umi_tools, so chronologically these two belong
  # beside samtools stats rather than with the read-preparation sections above — but every section
  # carrying carmack's `parent_id` renders inside the one `carmack` block, which is placed as a
  # unit, and `after: umitools` here is silently ignored (measured). Last within that block is
  # therefore as late as the report can put them, and is where carmack's own order puts them.
  carmack_linear_dedup_breakdown:
    order: 1011
  carmack_linear_dedup_chromosome_breakdown:
    order: 1012
  # Both arms trim with fastp and land in this one section despite arguments chosen per arm; the
  # `command` line of each sample's report is what tells them apart. Placed by `after:` rather than
  # by a number: measured against MultiQC 1.35, *any* positive `order:` pins this section to the
  # very top of the report, ahead of the carmack sections above. An unknown key here is ignored
  # silently, so both the anchor and the placement come from a real run.
  fastp:
    after: arm_gate
  "neurogenomics-jacquard-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "neurogenomics-jacquard-summary":
    order: -1002

export_plots: true

disable_version_detection: true
