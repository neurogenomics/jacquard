report_comment: >
  This report has been generated by the <a href="https://github.com/neurogenomics/jacquard/tree/dev" target="_blank">neurogenomics/jacquard</a>
  analysis pipeline.
# Left alone, MultiQC orders carmack's custom-content sections by payload id, which interleaves the
# four read-preparation stages and lands prepare-reads' distribution third of nine. These put them
# in the order the reads pass through them, and each stage's sections in the order its report reads.
report_section_order:
  carmack_extraction_breakdown:
    order: 1001
  carmack_extraction_edit_distance:
    order: 1002
  carmack_umi_breakdown:
    order: 1003
  carmack_umi_anchor_run:
    order: 1004
  carmack_tgidx_breakdown:
    order: 1005
  carmack_tgidx_target_distribution:
    order: 1006
  carmack_tgidx_edit_distance:
    order: 1007
  carmack_tgidx_anchor_run:
    order: 1008
  carmack_prepare_target_distribution:
    order: 1009
  "neurogenomics-jacquard-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "neurogenomics-jacquard-summary":
    order: -1002

export_plots: true

disable_version_detection: true
