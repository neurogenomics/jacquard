name: Run nf-test
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/meta.yml"
      - "**/*.md"
      - "**/*.png"
      - "**/*.svg"
  release:
    types: [published]
  workflow_dispatch:
  # Every push to main, including the Release PR merge that release-please tags, runs the full
  # suite and drives the README badge. The `release` trigger above cannot cover a tag:
  # release-please publishes its Release with GITHUB_TOKEN, and GitHub starts no workflow from an
  # event made with that token. No paths-ignore here, because the Release PR changes only
  # CHANGELOG.md.
  push:
    branches: [main]

# Cancel if a newer run is started
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NFT_VER: "0.9.4"
  NFT_WORKDIR: "~"
  NXF_ANSI_LOG: false
  NXF_SINGULARITY_CACHEDIR: ${{ github.workspace }}/.singularity
  NXF_SINGULARITY_LIBRARYDIR: ${{ github.workspace }}/.singularity
  # A PR runs only the tests its changes reach, against HEAD^, the base side of the merge commit
  # it is checked out as. Anywhere else HEAD^ is just the previous commit: after the Release PR
  # merge it is a commit that touched only CHANGELOG.md, so no test would be selected and
  # confirm-pass would still pass. Outside PRs the ref is empty and every test runs.
  NFT_CHANGED_SINCE: ${{ github.event_name == 'pull_request' && 'HEAD^' || '' }}

jobs:
  nf-test-changes:
    name: nf-test-changes
    runs-on: # use GitHub runners
      - "ubuntu-latest"
    outputs:
      shard: ${{ steps.set-shards.outputs.shard }}
      total_shards: ${{ steps.set-shards.outputs.total_shards }}
    steps:
      - name: Clean Workspace # Purge the workspace in case it's running on a self-hosted runner
        run: |
          ls -la ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          ls -la ./
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: get number of shards
        id: set-shards
        uses: ./.github/actions/get-shards
        env:
          NFT_VER: ${{ env.NFT_VER }}
        with:
          max_shards: 7
          changed_since: ${{ env.NFT_CHANGED_SINCE }}

      - name: debug
        run: |
          echo ${{ steps.set-shards.outputs.shard }}
          echo ${{ steps.set-shards.outputs.total_shards }}

  nf-test:
    name: "${{ matrix.profile }} | ${{ matrix.NXF_VER }} | ${{ matrix.shard }}/${{ needs.nf-test-changes.outputs.total_shards }}"
    needs: [nf-test-changes]
    if: ${{ needs.nf-test-changes.outputs.total_shards != '0' }}
    runs-on: # use GitHub runners
      - "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.nf-test-changes.outputs.shard) }}
        # docker only, deliberately. Every carmack-dependent local module declares the public
        # `ghcr.io/neurogenomics/carmack:sha-<pin>` image and no `conda` directive, so conda cannot run
        # them at all: carmack has no conda package. Singularity could pull that image but has no
        # leg here yet. The carmack-profile-gap job reports both profiles as not run.
        profile: [docker]
        NXF_VER:
          - "25.10.4"
          - "latest-everything"
    env:
      NXF_ANSI_LOG: false
      TOTAL_SHARDS: ${{ needs.nf-test-changes.outputs.total_shards }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Run nf-test
        id: run_nf_test
        uses: ./.github/actions/nf-test
        continue-on-error: ${{ matrix.NXF_VER == 'latest-everything' }}
        env:
          NFT_WORKDIR: ${{ env.NFT_WORKDIR }}
          NXF_VERSION: ${{ matrix.NXF_VER }}
        with:
          profile: ${{ matrix.profile }}
          shard: ${{ matrix.shard }}
          total_shards: ${{ env.TOTAL_SHARDS }}
          changed_since: ${{ env.NFT_CHANGED_SINCE }}

      - name: Report test status
        if: ${{ always() }}
        run: |
          if [[ "${{ steps.run_nf_test.outcome }}" == "failure" ]]; then
            echo "::error::Test with ${{ matrix.NXF_VER }} failed"
            # Add to workflow summary
            echo "## ❌ Test failed: ${{ matrix.profile }} | ${{ matrix.NXF_VER }} | Shard ${{ matrix.shard }}/${{ env.TOTAL_SHARDS }}" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ matrix.NXF_VER }}" == "latest-everything" ]]; then
              echo "::warning::Test with latest-everything failed but will not cause workflow failure. Please check if the error is expected or if it needs fixing."
            fi
            if [[ "${{ matrix.NXF_VER }}" != "latest-everything" ]]; then
              exit 1
            fi
          fi

      # continue-on-error keeps latest-everything from failing the job, so it never shows up in
      # `needs.nf-test.result` downstream and CI stays green. Surface it via a PR comment instead;
      # other NXF_VER failures already fail the job/CI directly, so no comment is needed for those.
      - name: Prepare PR comment fragment
        if: ${{ always() && steps.run_nf_test.outcome == 'failure' && matrix.NXF_VER == 'latest-everything' }}
        run: |
          mkdir -p pr-comment-fragment
          echo "* ❌ \`${{ matrix.profile }}\` | \`${{ matrix.NXF_VER }}\` | Shard ${{ matrix.shard }}/${{ env.TOTAL_SHARDS }}" > pr-comment-fragment/fragment.md

      - name: Upload PR comment fragment
        if: ${{ always() && steps.run_nf_test.outcome == 'failure' && matrix.NXF_VER == 'latest-everything' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-comment-fragment-${{ strategy.job-index }}
          path: pr-comment-fragment/

  # Announce the coverage hole rather than leaving it to whoever reads the matrix: the conda and
  # singularity profiles are untested here.
  carmack-profile-gap:
    name: "conda + singularity | not run"
    needs: [nf-test-changes]
    if: ${{ needs.nf-test-changes.outputs.total_shards != '0' }}
    runs-on:
      - "ubuntu-latest"
    steps:
      - name: Report the skipped profiles
        run: |
          echo "::warning::The conda and singularity profiles are not run. Nearly every test needs carmack, which has no conda package, and no singularity leg has been added yet. Only the docker profile is tested."
          {
            echo "## ⚠️ conda and singularity profiles not run"
            echo ""
            echo "Every carmack-derived module runs from \`ghcr.io/neurogenomics/carmack:sha-<pin>\`,"
            echo "the published image of the pinned \`external/carmack\` submodule."
            echo ""
            echo "| Profile | nf-test | Why |"
            echo "|---------|---------------|-----|"
            echo "| \`docker\` | run | public image named by the submodule pin |"
            echo "| \`conda\` | not run | carmack has no conda package |"
            echo "| \`singularity\` | not run | the image is pullable, but no singularity leg exists yet |"
          } >> $GITHUB_STEP_SUMMARY

  confirm-pass:
    needs: [nf-test]
    if: always()
    runs-on: # use GitHub runners
      - "ubuntu-latest"
    steps:
      - name: One or more tests failed (excluding latest-everything)
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: One or more tests cancelled
        if: ${{ contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All tests ok
        if: ${{ contains(needs.*.result, 'success') }}
        run: exit 0

      - name: debug-print
        if: always()
        run: |
          echo "::group::DEBUG: `needs` Contents"
          echo "DEBUG: toJSON(needs) = ${{ toJSON(needs) }}"
          echo "DEBUG: toJSON(needs.*.result) = ${{ toJSON(needs.*.result) }}"
          echo "::endgroup::"

      - name: Download PR comment fragments
        if: ${{ always() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: pr-comment-fragment-*
          path: pr-comment-fragments
          merge-multiple: true

      # Build a comment for the shared pr-comment.yml poster to publish on the PR.
      # Based on the fragments above (not needs.*.result) so non-blocking failures are still reported.
      - name: Prepare PR comment
        if: ${{ always() }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p pr-comment
          echo "$PR_NUMBER" > pr-comment/pr_number.txt
          echo "nf-test" > pr-comment/header.txt
          if [ -d pr-comment-fragments ] && [ -n "$(ls -A pr-comment-fragments)" ]; then
            {
              echo "## ❌ nf-test failed with latest Nextflow version"
              echo ""
              echo "> [!NOTE]"
              echo "> Tests with Nextflow's latest version failed but it will not cause a CI workflow failure."
              echo "> Please check if the failure is expected with newer (edge-)releases of Nextflow or if it needs fixing."
              echo ""
              cat pr-comment-fragments/*.md
              echo ""
              echo "See the [full run](${RUN_URL}) for details."
            } > pr-comment/comment.md
          fi

      - name: Upload PR comment artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-comment
          path: pr-comment/
