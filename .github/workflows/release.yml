name: Release

# Trunk-based release via release-please:
#   1. Every push to main -> release-please opens/refreshes a "Release PR" carrying the proposed
#      version bump (from conventional commits, pre-1.0 aware) and the CHANGELOG. Merges to main
#      do NOT tag or release on their own.
#   2. Merging that Release PR -> release-please creates the tag vX.Y.Z and the GitHub Release.
#
# release-please bumps version.txt (primary) and nextflow.config's manifest.version (extra-file,
# annotated with `x-release-please-version`) in lockstep.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
