repository_type: pipeline

nf_core_version: 4.1.0

lint:
  template_strings:
    - justfile # just interpolates recipe args with doubled braces, not Jinja
    - .claude/knowledge/carmack-image-tag-is-global.md # quotes that justfile recipe verbatim
  files_unchanged:
    - .gitattributes # carries the uv.lock merge=binary directive
    - .gitignore # un-ignores tests/data/ (the template's bare `data/` swallows the fixtures)
    - CODE_OF_CONDUCT.md
    - assets/nf-core-jacquard_logo_light.png
    - docs/images/nf-core-jacquard_logo_light.png
    - docs/images/nf-core-jacquard_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  nf_test_content:
    - tests/samplesheet_validation.nf.test # negative test: the run fails at validation, so there is no versions.yml to snapshot
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-jacquard_logo_light.png
    - docs/images/nf-core-jacquard_logo_light.png
    - docs/images/nf-core-jacquard_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: neurogenomics
  name: jacquard
  description: scMultiome Pipeline
  author: Hiranyamaya (Hiru) Dash, Chris Cheshire
  version: 0.1.0
  force: true
  outdir: .
  is_nfcore: false
