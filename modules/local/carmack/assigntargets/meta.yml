name: "carmack_assigntargets"
description: Assign a whitelisted target index to every read of a UMI-annotated R1 FASTQ
keywords:
  - single-cell
  - multiome
  - target index
  - fastq
tools:
  - "carmack":
      description: "Helper tools for the analysis of single-cell multi-omic data"
      homepage: "https://github.com/crick-pipelines-stp/carmack"
      documentation: "https://github.com/crick-pipelines-stp/carmack"
      tool_dev_url: "https://github.com/crick-pipelines-stp/carmack"

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
    - r1_umi:
        type: file
        description: UMI-annotated R1 FASTQ from `carmack extract-umis`
        pattern: "*.r1_umi.fastq.gz"
  - - chemistry:
        type: string
        description: Name of the carmack chemistry describing the target index layout

output:
  reads:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
      - "*.r1_tgidx.fastq.gz":
          type: file
          description: R1 reads carrying a TGIDX tag, either a whitelist entry or NONE
          pattern: "*.r1_tgidx.fastq.gz"
  stats:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
      - "*.tgidx_stats.txt":
          type: file
          description: Human-readable target assignment report
          pattern: "*.tgidx_stats.txt"
  multiqc:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
      - "*_mqc.json":
          type: file
          description: MultiQC custom-content payloads for the assignment summary, edit distances and anchor run lengths
          pattern: "*_mqc.json"
  versions_carmack:
    - - "${task.process}":
          type: string
          description: Name of the emitting process
      - "carmack":
          type: string
          description: Name of the tool
      - version:
          type: string
          description: Version of carmack, emitted on the `versions` topic

authors:
  - "@HDash"
  - "@chris-cheshire"
maintainers:
  - "@HDash"
  - "@chris-cheshire"
